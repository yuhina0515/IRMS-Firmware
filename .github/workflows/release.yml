name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match IRMS_FW_VERSION
        run: |
          # config.h uses CRLF line endings; strip CR before comparing.
          fw=$(sed -n 's/^#define IRMS_FW_VERSION "\(.*\)"/\1/p' IRMS_Sensor/config.h | tr -d '\r')
          tag="${GITHUB_REF_NAME#v}"
          echo "config.h=$fw tag=$tag"
          # The app compares this string with what the device reports; a mismatch would make
          # every device look outdated forever (or never).
          test "$fw" = "$tag"
      - uses: ./.github/actions/compile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifest + signature
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
          MIN_APP_VERSION: ${{ vars.MIN_APP_VERSION }}
        run: |
          # actions/checkout leaves a lightweight ref; fetch the annotated tag to read its message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.txt
          node scripts/make-manifest.mjs build/IRMS_Sensor.bin "${GITHUB_REF_NAME#v}" build notes.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # vX.Y.Z-anything is a beta: published as a GitHub prerelease, so the stable channel
          # (releases/latest) never sees it.
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.txt $pre             build/IRMS_Sensor.bin build/manifest.json build/manifest.json.sig
          # The beta channel reads the fixed beta-latest pointer; every tag (beta or stable)
          # refreshes it, so beta users also move on to a newer stable release.
          gh release view beta-latest >/dev/null 2>&1 || gh release create beta-latest --prerelease             --title "beta-latest (pointer)" --notes "Machine-read pointer for the IRMS app beta firmware channel. Download firmware from the versioned releases."
          gh release upload beta-latest build/manifest.json build/manifest.json.sig --clobber
